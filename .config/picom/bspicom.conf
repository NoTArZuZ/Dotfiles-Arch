animations = true;
animation-stiffness-in-tag = 150;
animation-stiffness-tag-change = 90.0;
animation-window-mass = 0.4;
animation-dampening = 15;
animation-clamping = false;
animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";
animation-for-transient-window = "slide-up"; #available options: slide-up, slide-down, slide-left, slide-right, squeeze, squeeze-bottom, zoom
animation-for-prev-tag = "minimize";
enable-fading-prev-tag = true;
animation-for-next-tag = "slide-in-center";
enable-fading-next-tag = true;
backend = "glx";
fading = true;
fade-delta = 5;
shadow = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-size = 6;
# vsync = true;
corner-radius = 12;
# opacity-rule = [ "90:class_g = 'steam'", "90:class_g = 'Cromite'" ];
blur-background-exclude = [ "window_type = 'menu'", "class_g = 'slop'", "class_g = 'Dunst'", "class_g = 'systray'", "class_g = 'Polybar'" ];
shadow-exclude = [ "class_g = 'Dunst'", "class_g = 'systray'", "class_g = 'Polybar'" ]
wintypes: { menu = { shadow = false; }; };
