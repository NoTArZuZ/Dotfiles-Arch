################
### MONITORS ###
################

monitor=,preferred,auto,auto

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    enable_swallow = true
    swallow_regex = ^(f|F)oot$
}

###################
### MY PROGRAMS ###
###################

$terminal = foot
$fileManager = foot yazi

#################
### AUTOSTART ###
#################

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dms run
exec-once = hyprctl setcursor macOS 28
exec-once = flameshot
exec-once = import-gsettings

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,28
env = XCURSOR_THEME,macOS
env = HYPRCURSOR_SIZE,28
env = HYPRCURSOR_THEME,macOS
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,gtk2
env = QT_QPA_PLATFORMTHEME_QT6,gtk2

###################
### PERMISSIONS ###
###################

ecosystem {
  enforce_permissions = 0
}


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 6
    gaps_out = 12

    border_size = 2

    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(505050ff)

    resize_on_border = false

    allow_tearing = true

    layout = master
}

master {
    mfact = 0.5
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 8
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 17
        color = 0xbb1a1a1a
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    bezier = overshoot,      0.05, 0.9,  0.1,  1.05
    bezier = md3_decel,      0.05, 0.7,  0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     4,     easeOutQuint
    animation = windows,       1,     2,     easeOutQuint
    animation = windowsIn,     1,     2,     overshoot,    slide
    animation = windowsOut,    1,     2,     overshoot,    slide
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  0,     1.79,  almostLinear
    animation = fadeLayersOut, 0,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear
    animation = workspacesIn,  1,     3,     md3_decel,    slide
    animation = workspacesOut, 1,     3,     md3_decel,    slide
    animation = zoomFactor,    1,     7,     quick
}

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

master {
    new_status = side
}

#############
### INPUT ###
#############

input {
    kb_layout = us, ru
    kb_variant =
    kb_model =
    kb_options = grp:caps_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, G, togglefloating,
bind = $mainMod, C, centerwindow,
bind = $mainMod, F, fullscreen,

bind = $mainMod, space, exec, dms ipc call spotlight toggle
bind = $mainMod, N, exec, dms ipc call notifications toggle
bind = $mainMod, TAB, exec, dms ipc call hypr toggleOverview
bind = $mainMod, D, exec, flameshot gui
bind = $mainMod SHIFT, D, exec, kooha

bind = $mainMod, J, cyclenext
bind = $mainMod, K, cyclenext, prev
bind = $mainMod CTRL, J, swapnext
bind = $mainMod CTRL, K, swapnext, prev
bind = $mainMod SHIFT, J, resizeactive, 0 -50
bind = $mainMod SHIFT, K, resizeactive, 0 50
bind = $mainMod, H, resizeactive, -50 0
bind = $mainMod, L, resizeactive, 50 0

bind = $mainMod, P, pin
bind = $mainMod, O, toggleswallow

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.3')
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.7) | if . < 1 then 1 else . end')

bind = , End, pass, class:^(discord)$

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = float, class:^(xdg-desktop-portal-gtk)$
windowrule = float, class:^(xdg-desktop-portal-hyprland)$
windowrule = fullscreen, noanim, class:^(flameshot)$
windowrule = noborder, noshadow, class:^(yabridge-host.exe.so)$
windowrule = float, noanim, title:^(Media viewer)$
layerrule = noanim, ^(quickshell)$

windowrule = immediate, class:^(steam_app_322170)$
